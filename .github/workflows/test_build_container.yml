# test docker containers
name: Tests

on:
  push:
     branches:
      - dev
      - master
      - docker_compose_postgre

  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    branches:
      - dev
      - master

jobs:
          
  docker_compose:
    strategy:
      matrix:
        os:
          - ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Verify Docker
      run: |
          docker --version
          docker compose version
    - name: check env vars
      run: docker compose config
    - name: Start services
      run: docker compose up --build --abort-on-container-exit --exit-code-from pipeline

    - name: Show running containers
      run: docker compose ps

    - name: Show logs on failure
      if: failure()
      run: docker compose logs

    - name: Tear down
      if: always()
      run: docker compose down -v
