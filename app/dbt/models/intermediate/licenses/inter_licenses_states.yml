version: 2

models:
  - name: inter_state_licenses

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - license_id
              - date

    columns:
      - name: renewable
        tests:
          - not_null

      - name: type
        tests:
          - not_null
    
      - name: license_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_initial_licenses')
                field: license_id