version: 2

models:
  - name: mart_license_metrics

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - type

    columns:
      - name: active_license_count
        tests:
          - not_null

      - name: inactive_license_count
        tests:
          - not_null

      - name: active_license_price
        tests:
          - not_null