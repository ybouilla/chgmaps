version: 2

sources:
  - name: raw

    tables:
      - name: initial_licenses
        columns:
          - name: id
            tests:
              - unique
              - not_null

          - name: creation_date
            tests:
              - not_null

          - name: renewable
            tests:
              - accepted_values:
                  arguments:
                    values: [0, 1]

      - name: license_changes
        columns:
          - name: id
            tests:
              - unique
              - not_null

          - name: license_id
            tests:
              - not_null

          - name: date
            tests:
              - not_null

          - name: renewable
            tests:
              - accepted_values:
                  arguments:
                    values: [0, 1]